[package]
name = "omniroute_compression_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4"] }
napi-derive = "2.16"
aho-corasick = "1.1"
regex = "1.10"
once_cell = "1.20"

[build-dependencies]
napi-build = "2"
